[workspace]
resolver = "2"
members = ["crates/proto", "crates/xlive", "crates/master", "crates/arc"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[profile.release]
panic = "abort"
